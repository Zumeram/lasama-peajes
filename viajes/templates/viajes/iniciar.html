<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar Viaje - LASAMA</title>
<style>
body{font-family:system-ui,sans-serif;max-width:500px;margin:40px auto;padding:20px;background:#f7f7f5}
form{background:white;padding:24px;border-radius:16px;border:1px solid #e5e5e5}
input{width:100%;padding:12px;margin:8px 0 16px 0;border:1px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;background:#0d2a54;color:white;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700}
a{color:#666;text-decoration:none}
.error{background:#fee2e2;color:#b91c1c;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px}
label{font-weight:600;font-size:14px;color:#0d2a54}
</style>
</head>
<body>
<a href="/">← Volver</a>
<h1>Nuevo Viaje 🚛</h1>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">
{% csrf_token %}
<label>Origen *</label>
<input name="origen" placeholder="Ej: Rengo" value="" required>

<label>Destino *</label>
<input name="destino" placeholder="Ej: Chiloé" value="" required>

<label>Patente</label>
<input name="patente" placeholder="Ej: ABCD12" value="">

<label>Chofer</label>
<input name="chofer" placeholder="Nombre del chofer" value="">

<button type="submit">Iniciar Viaje 🚛</button>
</form>
</body>
</html>
